<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 28" width="1200" height="28" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="g" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#00F0FF" stop-opacity="0"/>
      <stop offset="0.25" stop-color="#00F0FF" stop-opacity="0.8"/>
      <stop offset="0.5" stop-color="#25D366"/>
      <stop offset="0.75" stop-color="#8B5CF6" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="p" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fff"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-300%" width="140%" height="700%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g filter="url(#glow)">
    <rect x="40" y="13" width="1120" height="2" rx="1" fill="url(#g)"/>
    <rect y="12" width="160" height="4" rx="2" fill="url(#p)">
      <animate attributeName="x" from="-160" to="1200" dur="3.2s" repeatCount="indefinite"/>
    </rect>
  </g>
  <g transform="translate(600 14)">
    <rect x="-7" y="-7" width="14" height="14" fill="none" stroke="#00F0FF" stroke-width="1.5" transform="rotate(45)">
      <animateTransform attributeName="transform" type="rotate" from="45" to="405" dur="8s" repeatCount="indefinite"/>
    </rect>
    <rect x="-3" y="-3" width="6" height="6" fill="#25D366" transform="rotate(45)">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.6s" repeatCount="indefinite"/>
    </rect>
  </g>
  <g fill="#00F0FF" opacity="0.7">
    <rect x="470" y="12" width="4" height="4"/><rect x="480" y="12" width="4" height="4" opacity="0.6"/><rect x="490" y="12" width="4" height="4" opacity="0.3"/>
    <rect x="726" y="12" width="4" height="4"/><rect x="716" y="12" width="4" height="4" opacity="0.6"/><rect x="706" y="12" width="4" height="4" opacity="0.3"/>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
